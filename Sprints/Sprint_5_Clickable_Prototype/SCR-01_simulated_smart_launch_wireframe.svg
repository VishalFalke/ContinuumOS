<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">ContinuumOS SCR-01 simulated SMART launch and access status low-fidelity wireframe</title>
  <desc id="description">Desktop wireframe for the simulated clinician launch before protected patient or episode context has been retrieved.</desc>
  <style>
    .canvas { fill: #f2f4f7; }
    .screen { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
    .panel { fill: #ffffff; stroke: #98a2b3; stroke-width: 1.5; }
    .muted { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .button { fill: #1f2937; }
    .badge { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1; }
    .rule { stroke: #cbd5e1; stroke-width: 1.5; }
    .text { font-family: Inter, Arial, sans-serif; fill: #111827; }
    .heading { font-family: Inter, Arial, sans-serif; fill: #111827; font-weight: 700; }
    .caption { font-family: Inter, Arial, sans-serif; fill: #475467; }
  </style>

  <rect class="canvas" width="1440" height="900"/>
  <text x="80" y="62" class="heading" font-size="22">SCR-01 · Low-fidelity wireframe</text>
  <text x="80" y="91" class="caption" font-size="14">Planned synthetic prototype screen · pre-development specification</text>

  <rect x="80" y="130" width="1280" height="700" rx="8" class="screen"/>

  <!-- Header -->
  <rect x="81" y="131" width="1278" height="111" rx="7" fill="#f8fafc"/>
  <text x="128" y="178" class="heading" font-size="24">ContinuumOS</text>
  <text x="128" y="210" class="text" font-size="18">Simulated clinician launch</text>
  <rect x="1124" y="162" width="185" height="33" rx="16" class="badge"/>
  <text x="1145" y="184" class="heading" font-size="13">SYNTHETIC PROTOTYPE</text>
  <line x1="81" y1="242" x2="1359" y2="242" class="rule"/>

  <!-- Main panel -->
  <rect x="128" y="288" width="820" height="464" rx="8" class="panel"/>
  <text x="168" y="335" class="heading" font-size="16">Authorised launch context</text>
  <line x1="168" y1="358" x2="908" y2="358" class="rule"/>
  <text x="168" y="400" class="caption" font-size="14">SIGNED IN</text>
  <text x="168" y="427" class="text" font-size="17">Synthetic Clinic Physician · SYN-PRAC-3001</text>
  <text x="168" y="472" class="caption" font-size="14">ACCESS</text>
  <text x="168" y="499" class="text" font-size="17">Simulated EHR SMART launch · Read-only source context</text>

  <rect x="168" y="539" width="354" height="52" rx="6" class="button"/>
  <text x="194" y="572" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Start authorised simulated launch</text>

  <line x1="168" y1="630" x2="908" y2="630" class="rule"/>
  <text x="168" y="670" class="heading" font-size="16">Launch status</text>
  <circle cx="177" cy="704" r="8" fill="#ffffff" stroke="#344054" stroke-width="2"/>
  <text x="199" y="710" class="text" font-size="16">Ready — no protected patient context has been retrieved yet</text>

  <!-- Side guidance -->
  <rect x="982" y="288" width="326" height="464" rx="8" class="muted"/>
  <text x="1014" y="335" class="heading" font-size="16">What happens next</text>
  <line x1="1014" y1="358" x2="1276" y2="358" class="rule"/>
  <text x="1014" y="402" class="text" font-size="15">Verify authorised synthetic context,</text>
  <text x="1014" y="426" class="text" font-size="15">then open the episode workspace.</text>
  <rect x="1014" y="472" width="230" height="75" rx="6" fill="#ffffff" stroke="#98a2b3" stroke-width="1.5"/>
  <text x="1032" y="500" class="caption" font-size="12">SAFE BOUNDARY</text>
  <text x="1032" y="527" class="text" font-size="14">No patient or episode context</text>
  <text x="1032" y="546" class="text" font-size="14">is displayed before verification.</text>
  <line x1="1014" y1="597" x2="1276" y2="597" class="rule"/>
  <text x="1014" y="632" class="caption" font-size="13">SUPPORT ROUTE</text>
  <text x="1014" y="660" class="text" font-size="15">Product/platform administrator</text>
  <text x="1014" y="695" class="caption" font-size="13">Asha journey rail appears only after</text>
  <text x="1014" y="714" class="caption" font-size="13">authorised retrieval and linkage checks.</text>

  <!-- Footer -->
  <line x1="81" y1="782" x2="1359" y2="782" class="rule"/>
  <text x="128" y="808" class="caption" font-size="13">Represented audit evidence: EVT-01 launch context received · EVT-02 authorisation completed · EVT-03 source resource retrieved</text>
</svg>
